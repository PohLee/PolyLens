name: Validate Markdown Contracts

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate-markdown-contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Check all generated runtime resources and projections
        run: python tools/sync_playbooks.py --check

      - name: Validate PolyLens markdown contracts
        run: python tools/validate_markdown_contracts.py

      - name: Test CLI, isolated releases, safe installation, and protocol contracts
        run: python -B -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -m compileall -q tools tests

      - name: Smoke test Bash installer entrypoints
        if: runner.os == 'Linux'
        run: |
          bash tools/install_opencode.sh "$RUNNER_TEMP/polylens-opencode"
          bash tools/install_personal_skills.sh "$RUNNER_TEMP/polylens-standard"
